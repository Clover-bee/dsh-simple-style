# 校验插件源码 + 打包成 zip。
# - push 到 main：产出 Actions artifact（保留 90 天）
# - push v* tag：同样打包，并自动创建 Release、把 zip 挂成附件
name: package

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate manifests and source
        run: |
          node -e "const fs=require('fs');for (const f of ['appearance-styles/package.json','appearance-styles/locale/zh.json','appearance-styles/locale/en.json']) { JSON.parse(fs.readFileSync(f,'utf8')); console.log('ok', f); }"
          node --check appearance-styles/client.js
          node --check appearance-styles/index.js

      - name: Resolve version
        id: ver
        run: echo "version=$(node -p 'require("./appearance-styles/package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Build zip
        run: |
          zip -r dsh-simple-style.zip appearance-styles README.md
          unzip -l dsh-simple-style.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-simple-style
          path: dsh-simple-style.zip
          retention-days: 90

      # 版本号没变就只留 artifact，不顶掉已经发布过的那一版。
      - name: Check tag
        id: tagcheck
        run: |
          if git ls-remote --tags origin "refs/tags/v${{ steps.ver.outputs.version }}" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "v${{ steps.ver.outputs.version }} 已存在，跳过发版"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # 推 main 且版本号是新的 → 自动建 tag + Release；推 v* tag → 更新该 release。
      # 放在同一个 job 里是有意的：GITHUB_TOKEN 推的 tag 不会触发新的 workflow run。
      - name: Publish release
        if: steps.tagcheck.outputs.exists == 'false' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dsh-simple-style.zip
          generate_release_notes: true
          make_latest: true
